<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content=" width=device-width, initial-scale=1.0 ">
<title>AJAX</title>

<!--swiper-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"/>
<script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>

<!--original-->
<link href="css/ex5.css" rel="stylesheet" type="text/css">
<script type="text/javascript" src="https://code.jquery.com/jquery-latest.min.js"></script>
<script type="text/javascript" src="js/ex5.js"></script>

</head>

<body id="gototop">

<header>
        <!--logo-->
        <div class="logo">
            <a href="#">
            <img src="images/LOGO.png">
            </a>
        </div>
        <!--menu-->
        <div class="menu">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z" stroke="currentColor"/></svg>
        </div>
</header>   
<!--nav-->
<nav></nav>

<!-- swiper -->
<div class="swiper mySwiper">
    <div class="swiper-wrapper">
        <div class="swiper-slide">
            <video class="slideVideo" autoplay muted loop playsinline preload="metadata">
                    <source src="images/sea.mp4" type="video/mp4">
            </video>
            <h1>Imagination</h1>
        </div>

       
        <div class="swiper-slide">
            <video class="slideVideo" autoplay muted loop playsinline preload="metadata">
                    <source src="images/flower.mp4" type="video/mp4">
            </video>
            <h1>Dream</h1>
        </div>

    </div>
    <div class="swiper-button-next"></div>
    <div class="swiper-button-prev"></div>
    <div class="swiper-pagination"></div>
</div>

<!--menu-->
<section>
    <h1>more details</h1>
    
    <!--aside-->
    <aside>

        <div class="list" data-file="sea">風景</div>
        <div class="list" data-file="insect">昆蟲</div>
        <div class="list" data-file="flower">花朵</div>

    </aside>

    <!--article-->
    <article>
        <!--content-->
        <div class="content"></div>
        <!--content-->
        <div class="content"></div>
        <!--content-->
        <div class="content"></div>
    </article>
</section>

<!--totop-->
<div class="totopbt">
    <a href="#gototop">top</a>                        
</div>

<!--footer-->
<footer></footer> 

</body>
</html>
